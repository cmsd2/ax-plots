name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  # numerics needs an SBCL build of Maxima, and Ubuntu's maxima package is
  # GCL-based, so Maxima is built from source (and cached).
  MAXIMA_VERSION: 5.48.1
  MAXIMA_SHA256: b0916b5fb37b6eeaae400083175e68e28f80b9a1ab580c106a05448cf1c496b2

jobs:
  test:
    name: numerics ${{ matrix.numerics && 'yes' || 'no' }}, reactive ${{ matrix.reactive && 'yes' || 'no' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        numerics: [false, true]
        reactive: [false, true]

    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL and BLAS/LAPACK
        id: sbcl
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl libblas-dev liblapack-dev
          echo "version=$(sbcl --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Cache Maxima
        id: cache-maxima
        uses: actions/cache@v4
        with:
          path: ~/maxima
          key: maxima-${{ env.MAXIMA_VERSION }}-sbcl-${{ steps.sbcl.outputs.version }}-${{ steps.sbcl.outputs.image }}

      - name: Build Maxima
        if: steps.cache-maxima.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSL --retry 3 -o maxima.tar.gz \
            "https://sourceforge.net/projects/maxima/files/Maxima-source/${MAXIMA_VERSION}-source/maxima-${MAXIMA_VERSION}.tar.gz/download"
          echo "${MAXIMA_SHA256}  maxima.tar.gz" | sha256sum -c -
          tar xzf maxima.tar.gz
          cd "maxima-${MAXIMA_VERSION}"
          ./configure --prefix="$HOME/maxima" --enable-sbcl-exec --disable-build-docs --enable-quiet-build
          make -j"$(nproc)"
          make install

      - name: Add Maxima to PATH
        run: |
          echo "$HOME/maxima/bin" >> "$GITHUB_PATH"

      - name: Install mxpm
        working-directory: ${{ runner.temp }}
        run: |
          gh release download --repo cmsd2/maxima-mxpm --pattern 'mxpm-x86_64-unknown-linux-gnu.tar.gz'
          tar xzf mxpm-x86_64-unknown-linux-gnu.tar.gz
          sudo mv mxpm /usr/local/bin/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install ax-plots
        run: mxpm install --path . -y

      - name: Install reactive
        if: matrix.reactive
        run: |
          git clone --depth 1 https://github.com/cmsd2/maxima-reactive "$RUNNER_TEMP/maxima-reactive"
          mxpm install --path "$RUNNER_TEMP/maxima-reactive" -y

      # numerics comes from GitHub rather than the mxpm index: the indexed
      # release predates compile_grid, which the animate fast path uses.
      - name: Cache Quicklisp
        if: matrix.numerics
        uses: actions/cache@v4
        with:
          path: |
            ~/quicklisp
            ~/.cache/common-lisp
          key: quicklisp-sbcl-${{ steps.sbcl.outputs.version }}-${{ steps.sbcl.outputs.image }}

      - name: Install numerics
        if: matrix.numerics
        run: |
          git clone --depth 1 https://github.com/cmsd2/maxima-numerics "$RUNNER_TEMP/maxima-numerics"
          [ -d "$HOME/quicklisp" ] || mxpm setup quicklisp -y
          # Build numerics' Lisp dependencies with a large heap; compiling
          # them inside Maxima can run out of memory.
          sbcl --dynamic-space-size 4096 --non-interactive \
            --load "$HOME/quicklisp/setup.lisp" \
            --eval '(ql:quickload (list :magicl :trivial-garbage :alexandria :cffi :static-vectors) :silent t)'
          mxpm install --path "$RUNNER_TEMP/maxima-numerics" -y

      # The tests skip what an absent package would cover, so make sure each
      # job has exactly the packages its matrix entry says.
      - name: Check installed packages
        env:
          WANT_NUMERICS: ${{ matrix.numerics }}
          WANT_REACTIVE: ${{ matrix.reactive }}
        run: |
          status=0
          for pkg in numerics reactive; do
            want_var="WANT_${pkg^^}"
            out=$(maxima --very-quiet --batch-string="print(\"HAVE\", is(errcatch(load(\"$pkg\")) # []))\$" 2>&1)
            got=$(echo "$out" | grep -E '^HAVE ' | awk '{print $2}')
            echo "$pkg: want ${!want_var}, have ${got:-unknown}"
            if [ "$got" != "${!want_var}" ]; then
              status=1
              echo "::group::load(\"$pkg\") output"; echo "$out"; echo "::endgroup::"
            fi
          done
          if [ "$WANT_NUMERICS" = true ]; then
            cg=$(maxima --very-quiet --batch-string='load("numerics")$ print("HAVE", not (?fboundp(compile_grid) = false))$' 2>&1 \
                 | grep -E '^HAVE ' | awk '{print $2}')
            echo "compile_grid: have ${cg:-unknown}"
            [ "$cg" = true ] || status=1
          fi
          exit $status

      - name: Run tests
        run: mxpm test
